name: Docker Publish
 
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: on4r4p

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-admin:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-admin:sha-${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-worker:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-worker:sha-${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-vpn:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-vpn:sha-${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-init-runtime:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-init-runtime:sha-${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-x-login:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-x-login:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish

    env:
      WEBHOOK_URL: ${{ secrets.REDQUEENX_DEPLOY_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.REDQUEENX_DEPLOY_WEBHOOK_SECRET }}

    steps:
      - name: Trigger signed deploy webhook
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_SECRET}" ]; then
            echo "REDQUEENX_DEPLOY_WEBHOOK_URL and REDQUEENX_DEPLOY_WEBHOOK_SECRET are required."
            exit 1
          fi

          payload="$(
            jq -nc \
              --arg ref "${GITHUB_REF}" \
              --arg sha "${GITHUB_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '{ref: $ref, after: $sha, repository: {full_name: $repository}}'
          )"
          signature="$(
            printf '%s' "${payload}" \
              | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" -binary \
              | xxd -p -c 256
          )"

          curl -fsS \
            -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${signature}" \
            --data "${payload}"
