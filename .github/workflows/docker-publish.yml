name: Docker Publish
 
on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: on4r4p
  DEPLOY_REF: refs/heads/${{ github.event.workflow_run.head_branch }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build metadata
        shell: bash
        run: |
          {
            echo "BUILD_COMMIT_DATE=$(git show -s --format=%cI "${DEPLOY_SHA}")"
            echo "BUILD_COMMIT_SHA=${DEPLOY_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-admin:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-admin:sha-${{ env.DEPLOY_SHA }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-worker:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-worker:sha-${{ env.DEPLOY_SHA }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-vpn:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-vpn:sha-${{ env.DEPLOY_SHA }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-init-runtime:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-init-runtime:sha-${{ env.DEPLOY_SHA }}
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-x-login:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/redqueenx-x-login:sha-${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REDQUEENX_BUILD_COMMIT_DATE=${{ env.BUILD_COMMIT_DATE }}
            REDQUEENX_BUILD_COMMIT_SHA=${{ env.BUILD_COMMIT_SHA }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish

    env:
      WEBHOOK_URL: ${{ secrets.REDQUEENX_DEPLOY_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.REDQUEENX_DEPLOY_WEBHOOK_SECRET }}

    steps:
      - name: Skip deploy webhook when secrets are missing
        if: env.WEBHOOK_URL == '' || env.WEBHOOK_SECRET == ''
        run: |
          echo "REDQUEENX_DEPLOY_WEBHOOK_URL or REDQUEENX_DEPLOY_WEBHOOK_SECRET is missing."
          echo "Docker images were pushed, but the deploy webhook was skipped."

      - name: Trigger signed deploy webhook
        if: env.WEBHOOK_URL != '' && env.WEBHOOK_SECRET != ''
        shell: bash
        run: |
          set -euo pipefail

          payload="$(
            jq -nc \
              --arg ref "${DEPLOY_REF}" \
              --arg sha "${DEPLOY_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '{ref: $ref, after: $sha, repository: {full_name: $repository}}'
          )"
          signature="$(
            printf '%s' "${payload}" \
              | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" -binary \
              | xxd -p -c 256
          )"

          curl -fsS \
            -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${signature}" \
            --data "${payload}"
