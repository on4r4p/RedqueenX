services:
  init-runtime:
    build: .
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p \
          /app/runtime/media-cache \
          /app/runtime/playwright-profile \
          /app/runtime/x-auth \
          /app/runtime/x-browser
        chown -R "${REDQUEENX_UID:-1000}:${REDQUEENX_GID:-1000}" /app/runtime
    volumes:
      - ./runtime/docker:/app/runtime:rw
    restart: "no"

  caddy:
    image: caddy:2
    profiles:
      - caddy
    restart: unless-stopped
    depends_on:
      - admin
    environment:
      REDQUEENX_SITE: ${REDQUEENX_SITE:-localhost}
      ADMIN_PORT: ${ADMIN_PORT:-3005}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  admin:
    build: .
    restart: unless-stopped
    user: "${REDQUEENX_UID:-1000}:${REDQUEENX_GID:-1000}"
    command: ["npm", "run", "start"]
    depends_on:
      init-runtime:
        condition: service_completed_successfully
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT:-3005}
      ADMIN_TRUST_PROXY: "true"
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-password}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ADMIN_IPV4_WHITELIST: ${ADMIN_IPV4_WHITELIST:-127.0.0.1,172.16.0.0/12}
      ADMIN_IPV4_BLACKLIST: ${ADMIN_IPV4_BLACKLIST:-}
      DATABASE_URL: /app/runtime/redqueenx.sqlite
      CURRENT_SESSION_FILE: /app/runtime/current-session.log
      SEARCH_WITHOUT_API_ISOLATION: docker_vpn
      SEARCH_WITHOUT_API_PROFILE_DIR: /app/runtime/playwright-profile
      SEARCH_WITHOUT_API_MEDIA_CACHE_DIR: /app/runtime/media-cache
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      PLAYWRIGHT_DISABLE_SANDBOX: "false"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3005}:${ADMIN_PORT:-3005}"
    volumes:
      - ./.env:/app/.env:rw
      - ./runtime/docker:/app/runtime:rw
      - ./ops/vpn:/app/ops/vpn:rw

  vpn:
    build: .
    restart: unless-stopped
    command: ["/app/ops/docker/openvpn-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      SEARCH_WITHOUT_API_ISOLATION: docker_vpn
      VPN_CONFIG: ${VPN_CONFIG:-/app/ops/vpn/custom.conf}
      VPN_REMOTE_HOST: ${VPN_REMOTE_HOST:-}
      VPN_REMOTE_PORT: ${VPN_REMOTE_PORT:-1194}
      VPN_REMOTE_PROTO: ${VPN_REMOTE_PROTO:-udp}
      X_LOGIN_NOVNC_PORT: ${X_LOGIN_NOVNC_PORT:-6080}
    ports:
      - "127.0.0.1:${X_LOGIN_NOVNC_PORT:-6080}:${X_LOGIN_NOVNC_PORT:-6080}"
    volumes:
      - ./runtime/docker:/app/runtime:rw
      - ./ops/vpn:/app/ops/vpn:ro

  worker:
    build: .
    restart: unless-stopped
    user: "${REDQUEENX_UID:-1000}:${REDQUEENX_GID:-1000}"
    security_opt:
      - seccomp=unconfined
    command: ["npm", "run", "worker:docker-vpn"]
    network_mode: service:vpn
    depends_on:
      init-runtime:
        condition: service_completed_successfully
      vpn:
        condition: service_started
      admin:
        condition: service_started
    environment:
      DATABASE_URL: /app/runtime/redqueenx.sqlite
      CURRENT_SESSION_FILE: /app/runtime/current-session.log
      SEARCH_WITHOUT_API_ISOLATION: docker_vpn
      SEARCH_WITHOUT_API_PROFILE_DIR: /app/runtime/playwright-profile
      SEARCH_WITHOUT_API_MEDIA_CACHE_DIR: /app/runtime/media-cache
      REDQUEENX_DOCKER_VPN: "true"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      PLAYWRIGHT_DISABLE_SANDBOX: "false"
    volumes:
      - ./.env:/app/.env:ro
      - ./runtime/docker:/app/runtime:rw
      - ./ops/vpn:/app/ops/vpn:ro

  x-login:
    build: .
    profiles:
      - manual
    user: "${REDQUEENX_UID:-1000}:${REDQUEENX_GID:-1000}"
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    entrypoint: ["dumb-init", "--", "/app/ops/docker/x-login-entrypoint.sh"]
    network_mode: service:vpn
    depends_on:
      init-runtime:
        condition: service_completed_successfully
      vpn:
        condition: service_started
    environment:
      DATABASE_URL: /app/runtime/redqueenx.sqlite
      CURRENT_SESSION_FILE: /app/runtime/current-session.log
      SEARCH_WITHOUT_API_ISOLATION: docker_vpn
      SEARCH_WITHOUT_API_PROFILE_DIR: /app/runtime/playwright-profile
      SEARCH_WITHOUT_API_MEDIA_CACHE_DIR: /app/runtime/media-cache
      REDQUEENX_DOCKER_VPN: "true"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      PLAYWRIGHT_DISABLE_SANDBOX: "false"
      X_LOGIN_NOVNC_PORT: ${X_LOGIN_NOVNC_PORT:-6080}
      X_LOGIN_SCREEN: ${X_LOGIN_SCREEN:-1920x1080x24}
      X_LOGIN_SERVICE_MAX_SECONDS: ${X_LOGIN_SERVICE_MAX_SECONDS:-1200}
      X_LOGIN_BROWSER: ${X_LOGIN_BROWSER:-chrome}
      X_LOGIN_KEYBOARD_LAYOUT: ${X_LOGIN_KEYBOARD_LAYOUT:-}
      X_LOGIN_SAVE_MODE: ${X_LOGIN_SAVE_MODE:-auto}
      X_LOGIN_START_URL: ${X_LOGIN_START_URL:-https://x.com/login}
      X_LOGIN_REUSE_BROWSER_PROFILE: ${X_LOGIN_REUSE_BROWSER_PROFILE:-false}
      X_LOGIN_SKIP_NETWORK_PRECHECK: ${X_LOGIN_SKIP_NETWORK_PRECHECK:-false}
    volumes:
      - ./.env:/app/.env:ro
      - ./runtime/docker:/app/runtime:rw
      - ./ops/vpn:/app/ops/vpn:ro

volumes:
  caddy_data:
  caddy_config:
