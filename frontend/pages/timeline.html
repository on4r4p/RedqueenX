<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" />
    <title>RedqueenX Timeline</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="shortcut icon" type="image/x-icon" href="/trinity.ico?v=2" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="timeline-shell">
      <header class="timeline-topbar">
        <div class="brand-row">
          <div class="brand-mark" aria-label="RedqueenX"></div>
          <div>
            <h1>Timeline</h1>
            <p>Accepted tweets and imported texts</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="nav-link" href="/rejected-timeline" data-raw-timeline-link>Rejected Timeline</a>
          <a class="nav-link" href="/admin" data-admin-link>Admin</a>
        </div>
      </header>
      <p id="timeline-status" class="timeline-status"></p>
      <section class="timeline-maintenance-bar">
        <button id="retry-abs-twimg-failures" type="button" class="tweet-action-button" title="Retry timeline media downloads that previously failed because abs.twimg.com was blocked.">Retry failed media</button>
        <button id="archive-timeline" type="button" class="tweet-action-button" title="Archive the currently selected timeline sources without deleting them from the database.">Archive all</button>
        <button id="view-archive-timeline" type="button" class="tweet-action-button" title="Show archived timeline items.">View archive</button>
        <button id="restore-archive-timeline" type="button" class="tweet-action-button is-hidden" title="Restore the currently selected archived timeline sources.">Restore all</button>
        <div class="timeline-filter-field timeline-filter-field-inline" aria-label="Timeline source filters">
          <span>Show</span>
          <div class="timeline-filter-options" role="group" aria-label="Timeline source filters">
            <label><input type="checkbox" data-source-filter value="tweet" checked /> Tweets</label>
            <label><input type="checkbox" data-source-filter value="rss" checked /> RSS</label>
            <label><input type="checkbox" data-source-filter value="reddit" checked /> Reddit</label>
          </div>
        </div>
      </section>
      <nav id="timeline-pagination" class="timeline-pagination is-hidden" aria-label="Timeline pagination" data-timeline-pagination>
        <button type="button" class="tweet-action-button" data-page-action="prev">Previous</button>
        <span data-pagination-label></span>
        <button type="button" class="tweet-action-button" data-page-action="next">Next</button>
        <label class="timeline-page-size">
          Per page
          <input data-page-size type="number" min="1" max="200" step="1" value="50" aria-label="Timeline items per page" />
        </label>
        <button type="button" class="tweet-action-button" data-scroll-top>Back to top</button>
      </nav>
      <section id="timeline" class="timeline"></section>
      <nav id="timeline-pagination-bottom" class="timeline-pagination timeline-pagination-bottom is-hidden" aria-label="Timeline pagination bottom" data-timeline-pagination>
        <button type="button" class="tweet-action-button" data-page-action="prev">Previous</button>
        <span data-pagination-label></span>
        <button type="button" class="tweet-action-button" data-page-action="next">Next</button>
        <label class="timeline-page-size">
          Per page
          <input data-page-size type="number" min="1" max="200" step="1" value="50" aria-label="Timeline items per page" />
        </label>
        <button type="button" class="tweet-action-button" data-scroll-top>Back to top</button>
      </nav>
    </main>
    <script src="/assets/timeline.js" defer></script>
  </body>
</html>
